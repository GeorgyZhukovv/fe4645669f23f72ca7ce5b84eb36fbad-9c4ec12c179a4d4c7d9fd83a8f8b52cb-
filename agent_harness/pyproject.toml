[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_harness"
version = "0.1.0"
description = "A production-grade agentic coding harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Harness Maintainers" }]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "markdownify>=0.13.0",
    "trafilatura>=1.10.0",
    "tomli>=2.0.1 ; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "chardet>=5.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
