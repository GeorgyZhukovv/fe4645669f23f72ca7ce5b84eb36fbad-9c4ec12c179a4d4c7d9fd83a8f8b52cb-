# Tantalus model registry — every entry the harness knows about.
# `id` is the string used with `/model`. `api_model_name` is what gets sent to the provider.

# ---------- Anthropic ----------

[[anthropic]]
id = "claude-opus-4"
provider = "anthropic"
api_model_name = "claude-opus-4-8"
context_window_tokens = 200000
input_cost_per_million = 15.0
output_cost_per_million = 75.0
supports_tool_use = true
supports_vision = true
supports_streaming = true
tier = "frontier"
notes = "Highest-capability Anthropic model. Best for complex multi-step engineering."

[[anthropic]]
id = "claude-sonnet-4"
provider = "anthropic"
api_model_name = "claude-sonnet-4-6"
context_window_tokens = 200000
input_cost_per_million = 3.0
output_cost_per_million = 15.0
supports_tool_use = true
supports_vision = true
supports_streaming = true
tier = "strong"
notes = "Strong default — great cost/quality balance for most coding work."

[[anthropic]]
id = "claude-haiku-4"
provider = "anthropic"
api_model_name = "claude-haiku-4-5-20251001"
context_window_tokens = 200000
